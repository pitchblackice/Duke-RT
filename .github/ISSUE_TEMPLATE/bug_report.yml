name: Duke-RT Bug Report
description: Report a reproducible problem with Duke-RT
title: '[BUG] '
labels: bug

body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues and test with the latest [Duke-RT release](https://github.com/postmemetic/Duke-RT/releases) before filing a report.

        Duke-RT currently supports Duke Nukem 3D on Windows. Reports for other games or operating systems are outside the supported scope.
  - type: input
    id: version
    attributes:
      label: Duke-RT version
      description: Run `duke-rt.exe --version` or check the in-game console.
      placeholder: "Example: Duke-RT 1.12pre or Git commit 3175bd96d3"
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Windows version
      options:
        - Windows 11
        - Windows 10
    validations:
      required: true
  - type: input
    id: os-detail
    attributes:
      label: Windows edition and build
      description: Include the edition and OS build shown by `winver`, if known.
      placeholder: "Example: Windows 11 Pro, build 26100"
    validations:
      required: false
  - type: input
    id: hardware
    attributes:
      label: Relevant hardware and driver information
      description: Include your GPU model and driver version. Add CPU details when they may be relevant.
      placeholder: "Example: NVIDIA RTX 5070 Ti, driver 576.80; AMD Ryzen 7 5800X"
    validations:
      required: true
  - type: dropdown
    id: graphics-api
    attributes:
      label: Graphics API
      description: Use the backend reported near the start of `duke-rt.log`.
      options:
        - Direct3D 12
        - Vulkan
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Existing issues
      options:
        - label: I searched the existing issues and did not find the same problem.
          required: true
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: Clearly describe what happened and what you expected. Attach screenshots, video, or a save game when useful.
      placeholder: "What happened, and what should have happened instead?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the map, relevant settings, and the shortest reliable reproduction sequence.
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: config-file
    attributes:
      label: Duke-RT configuration
      description: |
        Attach `duke-rt.ini` from `C:\Users\<user>\Documents\My Games\duke-rt\duke-rt.ini` or include only the relevant settings.
        Remove any private information before uploading files.
      placeholder: "Drag duke-rt.ini here, or paste the relevant settings."
    validations:
      required: false
  - type: textarea
    id: log
    attributes:
      label: Duke-RT log
      description: |
        Attach `duke-rt.log` from `C:\Users\<user>\Documents\My Games\duke-rt\duke-rt.log` after reproducing the problem.
        Please upload the file instead of pasting the entire log into the issue.
      placeholder: "Drag duke-rt.log here, or paste the relevant error lines."
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other details that may help reproduce or diagnose the problem.
    validations:
      required: false
