name: Duke-RT Feature Request
description: Suggest a Duke-RT feature or improvement
title: '[Feature] '
labels: enhancement

body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues before suggesting a feature.

        Duke-RT currently focuses on Duke Nukem 3D path tracing on Windows. Requests for other games or operating systems are outside the supported scope.
  - type: checkboxes
    id: checked
    attributes:
      label: Existing requests
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or limitation
      description: Describe the Duke-RT problem, limitation, or workflow this request would address.
      placeholder: "What is difficult or missing today?"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the behavior or result you would like.
      placeholder: "How should Duke-RT handle this?"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have tried or considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add screenshots, mockups, links, or other context that clarifies the request.
    validations:
      required: false
